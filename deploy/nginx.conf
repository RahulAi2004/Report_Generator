# ---------------------------------------------------------------------------
# Edge configuration.
#
# Both the UI and the API are served from one origin, so session cookies stay
# SameSite=Strict and no CORS exemption is needed.
#
# TLS is commented out until certificates exist at deploy/certs/. Run
# `deploy/generate-cert.sh` for an internal self-signed pair, or drop in your
# own, then uncomment the HTTPS server block and the redirect.
# ---------------------------------------------------------------------------

upstream bi_web {
    server web:3000;
    keepalive 32;
}

upstream bi_api {
    server api:8000;
    keepalive 32;
}

# Report execution is expensive; protect the database from a runaway client.
limit_req_zone $binary_remote_addr zone=api_zone:10m rate=20r/s;
limit_req_zone $binary_remote_addr zone=login_zone:10m rate=6r/m;

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    server_name _;

    # Reports can legitimately return large result pages.
    client_max_body_size 8m;
    client_body_timeout 30s;

    # --- Security headers --------------------------------------------------
    add_header X-Frame-Options            "SAMEORIGIN"        always;
    add_header X-Content-Type-Options     "nosniff"           always;
    add_header Referrer-Policy            "same-origin"       always;
    add_header X-XSS-Protection           "0"                 always;
    add_header Permissions-Policy         "geolocation=(), microphone=(), camera=()" always;
    # Next.js needs inline styles and its own inline bootstrap script.
    add_header Content-Security-Policy
        "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self' data:; connect-src 'self'; frame-ancestors 'self'; base-uri 'self'; form-action 'self'"
        always;

    server_tokens off;
    gzip on;
    gzip_types application/json application/javascript text/css text/plain application/xml;
    gzip_min_length 1024;

    location = /healthz {
        access_log off;
        return 200 "ok\n";
        add_header Content-Type text/plain;
    }

    # Brute-force protection on sign-in specifically.
    location = /api/v1/auth/login {
        limit_req zone=login_zone burst=4 nodelay;
        proxy_pass http://bi_api;
        include /etc/nginx/conf.d/proxy_headers.conf;
    }

    location /api/ {
        limit_req zone=api_zone burst=40 nodelay;
        proxy_pass http://bi_api;
        include /etc/nginx/conf.d/proxy_headers.conf;

        # A long report must not be cut off by the proxy before the query
        # governor's own timeout has had a chance to stop it.
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
        proxy_buffering off;
    }

    location / {
        proxy_pass http://bi_web;
        include /etc/nginx/conf.d/proxy_headers.conf;
        proxy_read_timeout 60s;
    }
}

# ---------------------------------------------------------------------------
